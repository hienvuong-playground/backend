name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: acrhienplayground

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Containerfile'
              - '.github/workflows/build-push.yml'

  build-push:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Container Registry Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set image name
        run: echo "IMAGE=${{ env.ACR_NAME }}.azurecr.io/backend" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          podman build \
            -f Containerfile \
            --platform linux/amd64 \
            --layers \
            --cache-from "${IMAGE}/cache" \
            --cache-to "${IMAGE}/cache" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${{ steps.vars.outputs.sha }}" \
            .

      - name: Push image
        run: |
          podman push "${IMAGE}:latest"
          podman push "${IMAGE}:sha-${{ steps.vars.outputs.sha }}"
