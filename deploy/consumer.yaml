apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend-workload
      terminationGracePeriodSeconds: 60   # let in-flight messages finish on scale-in
      containers:
        - name: consumer
          image: ghcr.io/azure-samples/aks-app-samples/servicebusdemo:latest
          env:
            - name: OPERATION_MODE
              value: "consumer"
            - name: MESSAGE_COUNT
              value: "10"
            - name: AZURE_SERVICEBUS_QUEUE_NAME
              value: sbq-playground
            - name: AZURE_SERVICEBUS_HOSTNAME
              value: sbns-playground-gw2y5h.servicebus.windows.net