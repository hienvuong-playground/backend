apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # replicas is intentionally unset — the KEDA ScaledObject/HPA (see scaling.yaml)
  # owns the replica count. Setting it here would make Flux revert scale-ups.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "observability/instrumentation"
    spec:
      serviceAccountName: backend-workload
      initContainers:
        - name: database-setup
          image: acrhienplayground.azurecr.io/backend
          command: ["node", "db/bootstrap.js"]
          env:
            - name: PGSSLMODE
              value: verify-full
            - name: PGHOST
              value: ${POSTGRES_HOST}
            - name: PGUSER
              value: ${POSTGRES_USER}
            - name: PGDATABASE
              value: ${POSTGRES_DB}
      containers:
        - name: backend
          image: acrhienplayground.azurecr.io/backend
          ports:
            - containerPort: 3001
          env:
            - name: PGSSLMODE
              value: verify-full
            - name: PGHOST
              value: ${POSTGRES_HOST}
            - name: PGUSER
              value: ${POSTGRES_USER}
            - name: PGDATABASE
              value: ${POSTGRES_DB}
            - name: CORS_ORIGINS
              value: "https://${STATIC_WEB_APP_HOST},https://${DOMAIN_NAME}"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
          volumeMounts:
            - name: secrets
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "keyvault"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
