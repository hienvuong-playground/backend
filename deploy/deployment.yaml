apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # replicas is intentionally unset — the KEDA ScaledObject/HPA (see scaling.yaml)
  # owns the replica count. Setting it here would make Flux revert scale-ups.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "observability/instrumentation"
    spec:
      serviceAccountName: backend-workload
      containers:
      - name: backend
        image: acrhienplayground.azurecr.io/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        resources:
          requests:
            cpu: 50m
        envFrom:
        - secretRef:
            name: app-secrets
        volumeMounts:
        - name: secrets
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "keyvault"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 443
      targetPort: 3001
