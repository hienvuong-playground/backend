# The KEDA control hook that changes the Deployment's replica count. KEDA core is
# provided by the AKS managed add-on (workload_autoscaler_profile.keda_enabled);
# there is no self-installed KEDA or HTTP add-on. We scale on the backend's HTTP
# request rate read from Prometheus (fed by the OTel auto-instrumentation pipeline).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend
spec:
  scaleTargetRef:
    name: backend
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 60
  pollingInterval: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.observability.svc.cluster.local
        # The OTel prometheusremotewrite exporter maps service.name onto the
        # Prometheus `job` label as "<service.namespace>/<service.name>"
        # (here backend/backend) — there is no `service_name` label. Filtering on
        # service_name matched zero series, so KEDA read 0 and never scaled.
        #
        # Window is [2m], NOT [1m]: the backend's OTel SDK exports metrics every
        # 60s, so a 1m rate window usually spans only one sample and rate()
        # returns nothing. [2m] guarantees >=2 samples. (To go back to [1m], first
        # drop OTEL_METRIC_EXPORT_INTERVAL to ~15s on the backend.)
        query: sum(rate(http_server_duration_milliseconds_count{job="backend/backend"}[2m]))
        threshold: "5"

