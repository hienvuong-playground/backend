apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keyvault
spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    tenantId: ${AZURE_TENANT_ID}
    clientID: ${ID_BACKEND}
    keyvaultName: kv-playground-gw2y5h
    cloudName: ""
    objects: |
      array:
        - |
          objectName: my-secret
          objectType: secret
          objectVersion: "2caa3031b2b04dc48059a616a3055c9b"

  secretObjects:
  - secretName: app-secrets
    type: Opaque
    data:
    - objectName: my-secret
      key: SECRET
