services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: storefront
      POSTGRES_DB: storefront
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - storefront-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront -d storefront"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  storefront-postgres:
